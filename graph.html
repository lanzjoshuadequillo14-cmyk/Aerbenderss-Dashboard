<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aerocube - Telemetry Graph & History</title>
  
  <link rel="stylesheet" href="graph.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="mobile-top-bar">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="mobile-brand">AeroCube</div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand-box">
      <div class="brand-logo">
        <img src="logo/aerocube logo.png" alt="Logo">
      </div>
    </div>
    
    <ul class="sidebar-menu">
      <li><a href="index.html"><i data-lucide="layout-grid"></i> Dashboard</a></li>
      <li><a href="Graph.html" class="active"><i data-lucide="line-chart"></i> Graph</a></li>
      <li><a href="history.html"><i data-lucide="info"></i> History</a></li>
      <li><a href="settings.html"><i data-lucide="settings"></i> Settings</a></li>
    </ul>

    <ul class="sidebar-footer-menu">
      <li><a href="about.html"><i data-lucide="help-circle"></i> About</a></li>
      <li><a href="#" id="btn-logout" class="logout-link"><i data-lucide="log-out"></i> Logout</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <header>
      <h1>Telemetry Visualizer & History Log</h1>
      <div class="header-actions">
        <button id="btn-clear-history" class="btn btn-danger" style="display: none;">Clear History</button>
      </div>
    </header>

    <div class="card">
      <div class="card-title">Real-Time Sensor Trends</div>
      <div class="chart-container" style="height: 380px;">
        <canvas id="aerocubeChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">System Logs Logged</div>
      <div class="table-container" id="history-table-container">
        <p style='color: #64748b; font-size: 14px;'>Loading historical database records...</p>
      </div>
    </div>
  </main>

  <script type="module" src="graph.js"></script>
</body>
</html>
