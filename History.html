<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroCube | History</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="mobile-top-bar">
    <button class="menu-toggle-btn" id="menuToggle"><i data-lucide="menu"></i></button>
    <span class="mobile-brand">AeroCube</span>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top-group">
      <div class="sidebar-logo">
        <img src="logo/aerocube logo.png" alt="AeroCube Logo" onerror="this.style.display='none'">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
        <a href="graph.html" class="nav-item"><i data-lucide="line-chart"></i><span>Analytics</span></a>
        <a href="History.html" class="nav-item active"><i data-lucide="clock"></i><span>History</span></a>
        <a href="aeroplug.html" class="nav-item"><i data-lucide="plug"></i><span>AeroPlug</span></a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span>Settings</span></a>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="nav-item install-app-item" id="install-app-btn" type="button" hidden>
        <i data-lucide="download"></i><span>Install App</span>
      </button>
      <a href="about.html" class="nav-item"><i data-lucide="help-circle"></i><span>About</span></a>
      <a href="#" id="btn-logout" class="nav-item logout-link"><i data-lucide="log-out"></i><span>Logout</span></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="header-title">
        <h1>Historical Data</h1>
        <p class="header-subtitle">Recorded sensor readings from AeroCube</p>
      </div>
      <div class="header-badges">
        <div class="badge badge-live"><div class="badge-dot"></div>LIVE SYNC</div>
      </div>
    </header>

    <!-- Time Range Filters -->
    <section class="aeroplug-section">
      <div class="section-header">
        <h2><i data-lucide="clock"></i> System Readings Log</h2>
        <div class="mode-toggle-group">
          <button class="mode-btn active" data-range="today">TODAY</button>
          <button class="mode-btn" data-range="7d">7 DAYS</button>
          <button class="mode-btn" data-range="30d">30 DAYS</button>
        </div>
        <button class="btn-danger" id="btn-clear-history" type="button">
          <i data-lucide="trash-2"></i> Clear History
        </button>
      </div>
      <div class="history-table-container" id="history-table-container">
        <p class="history-empty">Loading recorded logs from Firebase...</p>
      </div>
    </section>
  </main>

  <script>lucide.createIcons();</script>
  <script src="pwa.js"></script>
  <script type="module" src="history.js"></script>
</body>
</html>
