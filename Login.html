<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aerocube Portal - Login</title>
  <link rel="stylesheet" href="Login.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>AEROCUBE</h2>
        <p>WELCOME TO AEROCUBE</p>
      </div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="admin@aerocube.io" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>

          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="Enter password" required>

            <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="ChangePassword.html">Forgot Password?</a>
        </div>

        <div id="login-error"></div>

        <button type="submit" id="btn-login-submit" class="btn-primary full-width">
          Sign In
        </button>
      </form>

     <div class="auth-footer">
        <p>Don't have an account? <a href="Registration.html">Register Here</a></p>
    </div>
    
    </div>
  </div>

  <script>
    lucide.createIcons();

    const passwordInput = document.getElementById('login-password');
    const togglePassword = document.getElementById('toggle-password');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';

      passwordInput.type = isHidden ? 'text' : 'password';

      togglePassword.innerHTML = isHidden
        ? '<i data-lucide="eye-off"></i>'
        : '<i data-lucide="eye"></i>';

      togglePassword.setAttribute(
        'aria-label',
        isHidden ? 'Hide password' : 'Show password'
      );

      lucide.createIcons();
    });
  </script>

  <script type="module" src="Login.js"></script>
</body>
</html>
