<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aerocube Portal - Change Password</title>
  <link rel="stylesheet" href="Login.css" />
  <style>
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
    }
    .toggle-password-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .toggle-password-btn:hover {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>AEROCUBE</h2>
        <p>CHANGE PASSWORD</p>
      </div>

      <form id="form-change-password" class="auth-form">
        <div class="form-group">
          <label for="cp-email">Email Address</label>
          <input type="email" id="cp-email" placeholder="admin@aerocube.io" required />
        </div>

        <div class="form-group">
          <label for="cp-current-password">Current Password</label>
          <div class="password-wrapper">
            <input type="password" id="cp-current-password" placeholder="Enter current password" required />
            <button type="button" class="toggle-password-btn" data-target="cp-current-password">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="cp-new-password">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="cp-new-password" placeholder="Enter new password" required minlength="6" />
            <button type="button" class="toggle-password-btn" data-target="cp-new-password">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="cp-confirm-password">Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="cp-confirm-password" placeholder="Confirm new password" required minlength="6" />
            <button type="button" class="toggle-password-btn" data-target="cp-confirm-password">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="cp-status" style="margin-bottom: 15px; font-size: 0.9em; text-align: center;"></div>

        <button type="submit" id="btn-cp-submit" class="btn-primary full-width">Update Password</button>
      </form>

      <div class="auth-footer" style="margin-top: 20px; text-align: center;">
        <p>Remembered your password? <a href="Login.html">Back to Login</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="ChangePassword.js"></script>
</body>
</html>
